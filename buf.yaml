# Buf module config for the CairnOS protos (one proto source builds both the
# gRPC server and the HTTP gateway).
version: v2
modules:
  - path: proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # RunWorkflow streams RunEvent by design; a RunWorkflowResponse wrapper
    # would add noise to every streamed line.
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # The plugin contract is named RunnerPlugin across the spec; a Service
    # suffix would put the docs and the wire name out of step.
    SERVICE_SUFFIX:
      - proto/cairnos/plugin/v1/plugin.proto
    # SendMessage and ConfirmAction both stream ChatEvent by design: an
    # approved confirmation continues the same event stream a turn produces, so
    # the web and CLI consumers fold one event union.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - proto/cairnos/v1/chat.proto
      # ReplayRun re-runs a workflow from its first failed action and streams
      # the same RunEvent stream RunWorkflow produces; a replay is a run, so a
      # separate response type would only duplicate the event union.
      - proto/cairnos/v1/workflow.proto
breaking:
  use:
    - FILE
