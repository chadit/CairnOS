name: ci

# Push only, every branch, no pull_request trigger: a fork cannot push here,
# so nobody without write access can start a run. Your own branches still get
# checks on each push, and branch protection reads those check runs.
# The repository setting that holds fork pull request runs for approval is the
# backstop should a pull_request trigger ever return. It is a setting, not a
# file, and GitHub only accepts it once the repository is public.
on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted on purpose: standard runners are free for a public
    # repository, and nothing of the owner's sits on the machine that runs
    # the job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # go.mod decides the toolchain, so CI builds with the same Go that `make`
      # resolves locally instead of whatever the runner image ships.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Linux is the only platform this job runs on. These two compiles catch a
      # macOS or Windows build break for the price of two builds, no extra
      # runner needed. They prove the code compiles there, never that it
      # behaves there.
      - name: cross-compile darwin and windows
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/cairnos
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/cairnos
      - name: unit tests
        run: make test-unit
      - name: script tests
        run: make test-scripts
      - name: integration tests
        run: make test-integration

  # Scoped deliberately to the plugin packages. The plugin subsystem is the one
  # part of CairnOS whose contract cannot be verified by cross-compilation: a
  # process-tree kill either works on real Windows or it does not. Windows
  # runners are the slowest to start, so the job stays this small. Do not
  # widen it.
  windows-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/runner/plugin holds the host-side lifetime tests, which is
      # what needs a real Windows kernel: the job object either takes the whole
      # process tree down or it does not. pkg/plugin's own server tests bind a
      # unix socket and stay Unix-only, so they are not run here.
      - name: plugin lifetime tests
        run: go test -race ./internal/runner/plugin/...

  # The SPA is a separate static bundle served outside the image, not something
  # the Go binary embeds, so there is no committed build to check for drift. What
  # is worth checking is that the bundle still lints, tests, and builds from
  # web/src, which is the only coverage this tree has for the front end.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node floats at the newest LTS on purpose, the same way golangci-lint
          # floats at latest: the web build runs on the newest LTS line instead
          # of a major somebody has to bump.
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Same toolchain rule as build: go.mod decides, not the runner image.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint is deliberately unpinned. `latest` here matches the
      # Makefile's `go install ...@latest`, so CI and a developer machine both
      # run the newest release instead of a version somebody has to bump.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      # gosec runs standalone because its golangci integration deadlocks on
      # multi-package runs; the make target holds the exclude list.
      - name: gosec
        run: make gosec
