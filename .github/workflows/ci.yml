name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Linux is the only platform this pipeline runs. These two compiles catch
      # a macOS or Windows build break for the price of two builds, without
      # paying the 10x/2x runner multipliers on every push. They prove the code
      # compiles there, never that it behaves there.
      - name: cross-compile darwin and windows
        run: |
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/cairnos
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/cairnos
      - name: unit tests
        run: make test-unit
      - name: integration tests
        run: make test-integration

  # Scoped deliberately to the plugin packages. The plugin subsystem is the one
  # part of CairnOS whose contract cannot be verified by cross-compilation: a
  # process-tree kill either works on real Windows or it does not. Everything
  # else stays on ubuntu-latest, so this job stays small enough that the 2x
  # Windows multiplier costs a few minutes per run. Do not widen it.
  windows-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # internal/runner/plugin holds the host-side lifetime tests, which is
      # what needs a real Windows kernel: the job object either takes the whole
      # process tree down or it does not. pkg/plugin's own server tests bind a
      # unix socket and stay Unix-only, so they are not run here.
      - name: plugin lifetime tests
        run: go test -race ./internal/runner/plugin/...

  # The SPA is a separate static bundle served outside the image, not something
  # the Go binary embeds, so there is no committed build to check for drift. What
  # is worth checking is that the bundle still lints, tests, and builds from
  # web/src, which is the only coverage this tree has for the front end.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Makefile is the one place the linter versions are written down, so
      # CI and a developer machine cannot drift apart. Without this the action
      # picks its own default and nothing declares which version ran.
      - name: read the pinned linter version
        id: pins
        run: echo "golangci=$(sed -n 's/^GOLANGCI_LINT_VERSION *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.pins.outputs.golangci }}
      # gosec runs standalone because its golangci integration deadlocks on
      # multi-package runs; the make target holds the exclude list.
      - name: gosec
        run: make gosec
