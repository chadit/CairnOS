name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Publishing goes through gh with GH_TOKEN, so the checkout keeps no
      # token in .git/config where the build steps could read it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # cmd/go stamps the commit it built from into every binary, and
          # `cairnos update` refuses an asset whose stamp is missing or does not
          # match the tag. A shallow clone leaves it unstamped.
          fetch-depth: 0
      # go.mod decides the toolchain, so a release is built with the same Go
      # that `make` resolves locally instead of whatever the runner image ships.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A tag build that publishes binaries must not restore a cache another
          # run could have poisoned.
          cache: false
      # No `buf generate` here on purpose. internal/api/gen is committed, so the
      # build has everything it needs, and regenerating would risk leaving the
      # tree dirty, which stamps every asset "+dirty" and makes the update
      # refuse the whole release.
      - name: build every platform
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="cairnos_${os}_${arch}"
            if [[ "$os" == windows ]]; then
              name="${name}.exe"
            fi
            echo "::notice::building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -o "dist/${name}" ./cmd/cairnos
          done
          cd dist
          sha256sum cairnos_* > checksums.txt
      # `update` reads the stamp out of the asset it downloaded and refuses one
      # that is absent or dirty, so a bad build fails here rather than on every
      # host at once.
      - name: check the stamps
        run: |
          for binary in dist/cairnos_*; do
            stamp="$(go version -m "$binary")"
            if ! grep -q 'vcs.revision=' <<<"$stamp"; then
              echo "::error::${binary} carries no vcs.revision stamp"
              exit 1
            fi
            if grep -q 'vcs.modified=true' <<<"$stamp"; then
              echo "::error::${binary} was built from a dirty tree"
              exit 1
            fi
          done
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null 2>&1 || { echo "::error::gh is not on PATH"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
