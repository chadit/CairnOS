// MessagingService: the outbound send surface over the configured chat
// identities (FR26-FR30). A caller names an identity, a target, and the text;
// the service resolves the target against that identity's transport and posts.
// ListIdentities answers what a caller may send as, so a CLI or workflow does
// not have to guess an identity name from config.

syntax = "proto3";

package cairnos.v1;

import "google/api/annotations.proto";

option go_package = "github.com/chadit/CairnOS/internal/api/gen/cairnos/v1;cairnosv1";

// MessagingService posts messages as a configured identity. Both methods take
// the message:send scope.
service MessagingService {
  // SendMessage posts text as one identity and returns the created post.
  rpc SendMessage(MessagingServiceSendMessageRequest) returns (MessagingServiceSendMessageResponse) {
    option (google.api.http) = {
      post: "/v1/messages"
      body: "*"
    };
  }

  // ListIdentities lists the identities a caller may send as.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (google.api.http) = {get: "/v1/messages/identities"};
  }
}

// Identity describes one configured send surface. transport names the chat
// system behind it (mattermost, telegram); username and display_name are the
// account a recipient sees; url is the server the identity posts to.
message Identity {
  string name = 1;
  string transport = 2;
  string username = 3;
  string display_name = 4;
  string url = 5;
}

// MessagingServiceSendMessageRequest carries one send. The name is
// service-qualified because cairnos.v1 already holds ChatService's
// SendMessageRequest, and both land in one Go package.
message MessagingServiceSendMessageRequest {
  // identity names a configured identity; an unknown name is NotFound.
  string identity = 1;

  // to is the target in one of four forms: "#channel-name", "@username",
  // "channel:<id>", or "user:<id>". A bare id is InvalidArgument (FR27).
  string to = 2;

  // text is the message body, sent unmodified so Mattermost renders any
  // mentions it contains (FR29). Empty is InvalidArgument.
  string text = 3;

  // thread_id optionally roots the post in an existing thread.
  string thread_id = 4;
}

// MessagingServiceSendMessageResponse identifies the created post, so a caller
// can thread a follow-up onto it.
message MessagingServiceSendMessageResponse {
  string post_id = 1;
  string channel_id = 2;
}

message ListIdentitiesRequest {}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}
