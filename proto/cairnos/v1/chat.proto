// ChatService: the Phase 9 conversational interface over the agent loop
// (.agents/spec/13-roadmap.md, Phase 9). A conversation is a long-lived agent
// action whose tools are memory, the vault, and a gated run_workflow trigger.
// SendMessage streams a turn's events; ConfirmAction resolves the D9
// confirmation gate before a proposed workflow runs.

syntax = "proto3";

package cairnos.v1;

import "cairnos/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/chadit/CairnOS/internal/api/gen/cairnos/v1;cairnosv1";

// ChatService holds conversations with the CairnOS agent. Every method takes
// the chat:session scope; SendMessage that proposes a workflow additionally
// needs write:workflow on the token, enforced at ConfirmAction.
service ChatService {
  // CreateSession opens a new conversation with a personality.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {
      post: "/v1/chat/sessions"
      body: "*"
    };
  }

  // SendMessage runs one conversation turn for a new user message and streams
  // its events: assistant text chunks, tool-call events, a
  // confirmation-required event when the agent proposes a workflow, run
  // started/finished events when a confirmed workflow fires, and a closing
  // turn-done event. The HTTP gateway delivers the stream as chunked
  // newline-delimited JSON, one event per line.
  rpc SendMessage(SendMessageRequest) returns (stream ChatEvent) {
    option (google.api.http) = {
      post: "/v1/chat/sessions/{session_id}/messages"
      body: "*"
    };
  }

  // ConfirmAction resolves a pending workflow proposal: approve fires the
  // workflow and streams its run events, deny clears the gate and runs
  // nothing. Approve additionally requires write:workflow on the token.
  rpc ConfirmAction(ConfirmActionRequest) returns (stream ChatEvent) {
    option (google.api.http) = {
      post: "/v1/chat/sessions/{session_id}/confirm"
      body: "*"
    };
  }

  // GetSession fetches one session's metadata.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {get: "/v1/chat/sessions/{session_id}"};
  }

  // ListSessions lists the workspace's sessions, most-recently-updated first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v1/chat/sessions"};
  }

  // ListMessages returns one session's full transcript in order.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {get: "/v1/chat/sessions/{session_id}/messages"};
  }

  // SearchMessages runs full-text search over the workspace's transcripts.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse) {
    option (google.api.http) = {get: "/v1/chat/search"};
  }
}

// ChatSession is one persisted conversation.
message ChatSession {
  string id = 1;
  string personality = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// ChatMessage is one entry in a conversation.
message ChatMessage {
  int32 seq = 1;

  // role is user, assistant, or tool.
  string role = 2;

  string content = 3;
  google.protobuf.Timestamp created_at = 4;

  // session_id names the conversation the message belongs to, so a search
  // hit identifies its session without a separate lookup.
  string session_id = 5;
}

// ChatEventType says what a ChatEvent describes.
enum ChatEventType {
  CHAT_EVENT_TYPE_UNSPECIFIED = 0;
  CHAT_EVENT_TYPE_ASSISTANT_CHUNK = 1;
  CHAT_EVENT_TYPE_TOOL_CALL = 2;
  CHAT_EVENT_TYPE_CONFIRMATION_REQUIRED = 3;
  CHAT_EVENT_TYPE_RUN_STARTED = 4;
  CHAT_EVENT_TYPE_RUN_FINISHED = 5;
  CHAT_EVENT_TYPE_TURN_DONE = 6;
}

// WorkflowProposal is the D9 confirmation payload: the workflow the agent wants
// to run, its inputs, and the estimated spend, shown so the user approves from
// full information.
message WorkflowProposal {
  string workflow_name = 1;
  google.protobuf.Struct inputs = 2;
  double estimated_budget_usd = 3;
}

// ChatEvent is one entry in a turn's stream. Only the fields a given type uses
// are set.
message ChatEvent {
  ChatEventType type = 1;

  // text carries assistant reply text on ASSISTANT_CHUNK and the final reply
  // on TURN_DONE.
  string text = 2;

  // tool and tool_input are set on TOOL_CALL.
  string tool = 3;
  google.protobuf.Struct tool_input = 4;

  // proposal is set on CONFIRMATION_REQUIRED.
  WorkflowProposal proposal = 5;

  // run_id is set on RUN_STARTED and RUN_FINISHED; run_status on RUN_FINISHED.
  string run_id = 6;
  string run_status = 7;
}

message CreateSessionRequest {
  // personality names the session's personality; empty uses the default.
  string personality = 1;
}

message CreateSessionResponse {
  ChatSession session = 1;
}

message SendMessageRequest {
  string session_id = 1;
  string message = 2;
}

message ConfirmActionRequest {
  string session_id = 1;

  // approve fires the pending workflow; deny clears the gate without running.
  bool approve = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  ChatSession session = 1;
}

message ListSessionsRequest {
  // limit caps the result count; zero means no cap.
  int32 limit = 1;
}

message ListSessionsResponse {
  repeated ChatSession sessions = 1;
}

message ListMessagesRequest {
  string session_id = 1;
}

message ListMessagesResponse {
  repeated ChatMessage messages = 1;
}

message SearchMessagesRequest {
  // text is the full-text query; empty is InvalidArgument.
  string text = 1;

  // session_id optionally narrows hits to one session.
  string session_id = 2;

  // limit caps the result count; zero means no cap, matching SearchMemory.
  int32 limit = 3;
}

message SearchMessagesResponse {
  repeated ChatMessage messages = 1;
}
